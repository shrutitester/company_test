name: spendar
description: SpendArc — Personal Finance Tracker. Production Flutter assessment app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2

  # Dependency injection
  get_it: ^7.6.4

  # Functional error handling
  dartz: ^0.10.1

  # Local database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # HTTP client
  dio: ^5.3.2

  # Utilities
  equatable: ^2.0.5
  uuid: ^4.2.1

  # Code generation (for hive adapters)
  # Run: flutter pub run build_runner build

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Testing
  bloc_test: ^9.1.5
  mocktail: ^1.0.1

  # Code generation
  build_runner: ^2.4.6
  hive_generator: ^2.0.1

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
